<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Tetron Technologies</title>

    <link rel="stylesheet" href="../css/signup.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            <img src="../image/tetronlogo.png">
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="aboutus.html">About Us</a>

            <a href="services.html">Services</a>

            <a href="courses.html">Our Courses</a>

            <a href="contactus.html">Contact Us</a>

            <a href="policies.html">Policies</a>

            <a href="login.html">Login</a>

            <a href="signup.html" class="active">Sign Up</a>

        </nav>

    </nav>


    <!-- ================= SIGN UP SECTION ================= -->

    <section class="signup-section">

        <div class="signup-container">

            <h1>Create Account</h1>

            <p class="signup-subtitle">
                Create your Tetron Technologies account
            </p>


            <!-- Sign Up Form -->

            <form action="login.html" method="get">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Terms -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="policies.html">
                                Terms and Conditions
                            </a>
                        </span>

                    </label>

                </div>


                <!-- Sign Up Button -->

                <button type="submit">
                    Sign Up
                </button>


                <!-- Login Link -->

                <p class="login-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>

        </div>

    </section>


</body>

</html>
